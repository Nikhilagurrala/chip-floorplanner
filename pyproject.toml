[project]
name = "chip_floorplanner"
version = "0.1.0"
description = "Chip Floorplanning environment for OpenEnv — A real-world EDA task."
authors = [
    {name = "diva29", email = "user@example.com"}
]
dependencies = [
    "openenv-core",
    "fastapi",
    "uvicorn",
    "gradio",
    "openai",
    "websockets",
    "python-dotenv",
    "rich",
    "pydantic"
]

requires-python = ">=3.10"

[project.scripts]
server = "chip_floorplanner.server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["chip_floorplanner*"]
